# GhostLock specialized-engine payload catalogue (HOCON).
#
# One entry per firmware. Selection is by `release` (the device's `uname -r`),
# exactly like GhostLock-H80GT's own manifest; no serial, no account, no
# per-device identifier is stored here or compared at runtime.
#
# The six per-firmware exploits are committed under h80gt/exploits/; the shared
# set is staged from the pinned release bundle into assets/h80gt/shared/ by
# `prepareH80gtPayload`. Every file is verified against `size` + `sha256` by
# `verifyH80gtPayload`, by the APK check and again by the Shizuku service before
# every run. A mismatch refuses the run.
#
# Only the exploit differs per firmware; the module, the userspace tools and
# the loader template are firmware-independent and live in `shared`.
#
# This fork ships PATCHED exploit binaries. The only source change is in
# GhostLock-H80GT exploit/src/targets/*/target.h: DIRECT_MAP_END now covers the
# 16GB high-bank top (0xB80000000) instead of the 12GB bound (0xAB0000000), so
# sysctl_do_walk() stops skipping valid pages above the old bound. Attribution
# and licenses are in NOTICE.md; the payload change and its 2026-10-30 device
# evidence are in docs/analysis/h80gt-16gb-range-fix.md.
#
# Source: GhostLock-H80GT v0.3.1 (33541d1) release bundle,
# ghostlock.tar.gz sha256 a5a3cff2c3172bd5debe2a4e4f71c69402c00c8cffd37906b1354437b4c8810e.
# `load_ko`, `kmsg_dumper` and `kernelsu.ko` are gitignored build products of
# that repository and exist only in the bundle; the commands that reproduce
# them are recorded per artifact.
