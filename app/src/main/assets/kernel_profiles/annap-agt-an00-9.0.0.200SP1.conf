# optional refinements and are deliberately omitted here: no device-unique or
# build-instance data is shipped or compared.
release = "5.10.236-android12-9-gd1575ab10b30"
schema_version = 1
engine = "h80gt"
kernel_major = 5
recommend_shizuku = 1

h80gt {
  payload = "annap-AGT-AN00_9.0.0.200SP1"
  firmware = "9.0.0.200SP1"
  manager_version = "3.3.0"
}
