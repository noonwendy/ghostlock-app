# GhostLock profile: HONOR 80 GT (AGT-AN00), MagicOS 8.0.0.128.
#
# engine = "h80gt" drives the GhostLock-H80GT specialized chain (per-firmware
# exploit + custom KernelSU loader + KernelSU v3.3.0 module) instead of the
# native GLK1 pipeline, so this profile carries no offsets, no credential
# template and no route.
#
# Selection is by `release` alone (the device's `uname -r`), exactly like
# GhostLock-H80GT's own manifest. `h80gt.device` and `h80gt.fingerprint` are
# optional refinements and are deliberately omitted here: no device-unique or
# build-instance data is shipped or compared.
#
# payload:         id of the bundled payload set (assets/h80gt/payloads.conf)
# firmware:        MagicOS version the exploit was compiled for
# manager_version: KernelSU release the module was built from
release = "5.10.168-android12-9-g804a21a522f0"
schema_version = 1
engine = "h80gt"
kernel_major = 5
recommend_shizuku = 1

h80gt {
  payload = "annap-AGT-AN00_8.0.0.128"
  firmware = "8.0.0.128"
  manager_version = "3.3.0"
}
